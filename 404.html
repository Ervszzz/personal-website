<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Ervin Fernandez</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/personal-website/favicon.svg" />
    <!-- Same theme choice as the main site: light unless the visitor picked dark -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        document.documentElement.classList.toggle("dark", saved === "dark");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Tokens copied from src/index.css */
      :root {
        --c-bg: 245 247 248;
        --c-surface: 255 255 255;
        --c-ink: 14 26 36;
        --c-muted: 91 107 120;
        --c-line: 217 224 229;
        --c-accent: 11 122 117;
        --c-accent-ink: 255 255 255;
        --c-warn: 178 106 0;
        color-scheme: light;
      }
      .dark {
        --c-bg: 13 20 24;
        --c-surface: 19 29 35;
        --c-ink: 232 238 241;
        --c-muted: 143 161 173;
        --c-line: 36 50 58;
        --c-accent: 63 212 199;
        --c-accent-ink: 13 20 24;
        --c-warn: 242 179 61;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 2rem 1rem;
        background: rgb(var(--c-bg));
        color: rgb(var(--c-ink));
        font-family: "Schibsted Grotesk", system-ui, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 36rem; margin: 0 auto; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0.75rem;
        border: 1px solid rgb(var(--c-line));
        border-radius: 999px;
        background: rgb(var(--c-surface));
        color: rgb(var(--c-muted));
        font-size: 0.875rem;
      }
      .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: rgb(var(--c-warn)); }
      h1 {
        margin: 1.5rem 0 0;
        font-size: clamp(3rem, 12vw, 5rem);
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.035em;
      }
      p { margin: 1rem 0 0; font-size: 1.125rem; color: rgb(var(--c-muted)); }
      code {
        font-family: "Martian Mono", ui-monospace, monospace;
        font-size: 0.8em;
        color: rgb(var(--c-ink));
        word-break: break-all;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2rem; }
      a {
        display: inline-flex;
        align-items: center;
        padding: 0.625rem 1.25rem;
        border-radius: 6px;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 0.2s, border-color 0.2s, color 0.2s;
      }
      .primary { background: rgb(var(--c-accent)); color: rgb(var(--c-accent-ink)); }
      .primary:hover { background: rgb(var(--c-accent) / 0.85); }
      .secondary { border: 1px solid rgb(var(--c-line)); background: rgb(var(--c-surface)); color: rgb(var(--c-ink)); }
      .secondary:hover { border-color: rgb(var(--c-accent)); color: rgb(var(--c-accent)); }
      a:focus-visible { outline: 2px solid rgb(var(--c-accent)); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <span class="status"><span class="dot" aria-hidden="true"></span>404</span>
      <h1>Page not found</h1>
      <p>Nothing lives at <code id="path"></code>. The link may be old, or the address mistyped.</p>
      <div class="actions">
        <a class="primary" href="/personal-website/">Go to the home page</a>
        <a class="secondary" href="/personal-website/blog/">Read the blog</a>
      </div>
    </main>
    <script>
      document.getElementById("path").textContent = window.location.pathname;
    </script>
  </body>
</html>
